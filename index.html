<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors - Mega Edition</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <header class="header">
      <h1>Rock Paper Scissors</h1>
      <p class="subtitle">Mega Edition • Enterprise Combat Engine</p>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard">
      <div class="score-card player">
        <span class="label">Player</span>
        <span id="player-score" class="score">0</span>
      </div>
      <div class="score-divider">:</div>
      <div class="score-card computer">
        <span class="label">Computer</span>
        <span id="computer-score" class="score">0</span>
      </div>
    </section>

    <!-- Battle Arena -->
    <section class="arena">
      <div class="choice-display player-choice-box">
        <div class="choice-circle" id="player-display">❓</div>
        <span class="choice-name">You</span>
      </div>
      <div class="versus">VS</div>
      <div class="choice-display computer-choice-box">
        <div class="choice-circle" id="computer-display">❓</div>
        <span class="choice-name">Computer</span>
      </div>
    </section>

    <!-- Message / Result -->
    <div id="result-message" class="result-message">
      Select an option below to play!
    </div>

    <!-- Controls / Action Buttons -->
    <section class="controls">
      <button class="btn-choice" data-choice="rock" title="Rock">
        <span class="emoji">✊</span>
        <span class="text">Rock</span>
      </button>
      <button class="btn-choice" data-choice="paper" title="Paper">
        <span class="emoji">✋</span>
        <span class="text">Paper</span>
      </button>
      <button class="btn-choice" data-choice="scissors" title="Scissors">
        <span class="emoji">✌️</span>
        <span class="text">Scissors</span>
      </button>
    </section>

    <!-- Footer Controls -->
    <div class="actions">
      <button id="reset-btn" class="btn-reset">🔄 Reset Game</button>
    </div>

    <!-- Move History Log -->
    <section class="history-container">
      <h3>Match History</h3>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </div>

  <script src="src/database.js"></script>
  <script src="src/ai-matrix.js"></script>
  <script src="src/game-core.js"></script>
  <script src="src/battle-simulator.js"></script>
  <script src="script.js"></script>
</body>
</html>
